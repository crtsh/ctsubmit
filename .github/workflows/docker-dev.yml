name: Docker - Development Build

#Run this action against any commit on main.
on:
  push:
    branches:
        - main
  workflow_dispatch:
  release:
    types: 
      - published
      
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Cache main image layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-main-cache
          key: ${{ runner.os }}-buildx-main-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-main-

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get the latest commit hash and timestamp
        id: vars
        run: |
          CONTAINER_TIMESTAMP=$(date -u +'%Y%m%d%H%M%S')
          echo "CONTAINER_TIMESTAMP=$CONTAINER_TIMESTAMP" >> $GITHUB_OUTPUT
          
      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: gomodfile=dev_go.mod
          push: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          tags: ghcr.io/crtsh/ctsubmit-dev:${{ steps.vars.outputs.CONTAINER_TIMESTAMP }}
          labels: ghcr.io/crtsh/ctsubmit-dev:${{ steps.vars.outputs.CONTAINER_TIMESTAMP }}
          platforms: linux/amd64,linux/arm64
          provenance: false

      # Temp fix
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Assert the architecture of every ELF in the arm64 image without
      # executing anything. The smoke test below runs under QEMU (registered by
      # setup-qemu-action), so an x86-64 binary in the arm64 image would still
      # run and pass there (this is how #389 slipped through). Reading the ELF
      # e_machine field (offset 0x12; b7 00 = aarch64) catches a wrong-arch
      # binary regardless of emulation, for any file added to the image.
      - name: Assert arm64 binary architectures
        run: |
          IMAGE="ghcr.io/crtsh/ctsubmit-dev:${{ steps.vars.outputs.CONTAINER_TIMESTAMP }}"
          cid=$(docker create --platform linux/arm64 "$IMAGE")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rc=0
          for f in app/ctsubmit sbin/tini; do
            machine=$(docker cp "$cid:/$f" - | tar -xO | od -An -tx1 -j18 -N2 | tr -d ' ')
            if [ "$machine" = "b700" ]; then
              echo "/$f: aarch64 (b7 00) OK"
            else
              echo "/$f: expected aarch64 (b7 00) but found e_machine bytes '$machine'"
              rc=1
            fi
          done
          exit $rc

      # Verify the arm64 manifest entry actually runs. The build job runs on an
      # amd64 runner, so without this the arm64 binary is never executed in CI
      # (this is how #377 shipped an x86-64 binary in the arm64 image). livez
      # goes OK as soon as the HTTP server is up, independent of external CT-log
      # data. QEMU-emulated startup is slower, so allow a generous window.
      - name: Smoke test the published image (arm64)
        run: |
          IMAGE="ghcr.io/crtsh/ctsubmit-dev:${{ steps.vars.outputs.CONTAINER_TIMESTAMP }}"
          docker run -d --name ctsubmit-arm64 --platform linux/arm64 -p 8091:8081 "$IMAGE"
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8091/livez >/dev/null 2>&1; then
              echo "arm64 image is live."
              docker rm -f ctsubmit-arm64 || true
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for arm64 image to become live."
          docker logs ctsubmit-arm64 || true
          docker rm -f ctsubmit-arm64 || true
          exit 1
