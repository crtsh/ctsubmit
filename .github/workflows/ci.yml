name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Minimum overall statement coverage (%) required to pass. Ratchet this
      # upward over time to prevent coverage regressions as the codebase grows.
      COVERAGE_THRESHOLD: "60"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: true

      - name: Generate templates
        run: go run github.com/valyala/quicktemplate/qtc@v1.8.0 -dir=request/templates

      - name: Run tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        run: |
          # Drop generated quicktemplate sources: their //line directives point
          # back at the .qtpl files, which `go tool cover` cannot parse.
          grep -v '/request/templates/' coverage.out > coverage.filtered.out
          go tool cover -func=coverage.filtered.out
          go tool cover -html=coverage.filtered.out -o coverage.html

      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.filtered.out | awk '/^total:/ {sub(/%/, "", $NF); print $NF}')
          echo "Total coverage: ${total}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v total="$total" -v min="$COVERAGE_THRESHOLD" \
            'BEGIN { exit (total + 0 < min + 0) ? 1 : 0 }' \
            || { echo "::error::Coverage ${total}% is below the required ${COVERAGE_THRESHOLD}%"; exit 1; }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          if-no-files-found: ignore

  lint:
    permissions:
      contents: read  # for actions/checkout to fetch code
      pull-requests: read  # for golangci/golangci-lint-action to fetch pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templates
        run: go run github.com/valyala/quicktemplate/qtc@v1.8.0 -dir=request/templates

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templates
        run: go run github.com/valyala/quicktemplate/qtc@v1.8.0 -dir=request/templates

      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  test-race:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templates
        run: go run github.com/valyala/quicktemplate/qtc@v1.8.0 -dir=request/templates

      - name: Run tests with race detector
        run: go test -race ./...

  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -t ctsubmit:ci .

      - name: Smoke test container
        run: |
          # Start the container in the background.
          docker run -d --name ctsubmit-smoke -p 8081:8081 ctsubmit:ci

          # Wait for the container to start accepting connections.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/livez > /dev/null 2>&1; then
              echo "Container is alive"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Container failed to respond to /livez within 30s"
              docker logs ctsubmit-smoke
              exit 1
            fi
            sleep 1
          done

          # Verify the liveness response.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/livez)
          echo "livez returned HTTP $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Expected 200, got $STATUS"
            docker logs ctsubmit-smoke
            exit 1
          fi

          docker stop ctsubmit-smoke
